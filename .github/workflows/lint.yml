name: ESLint Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install and lint client
        run: |
          if [ -d client ]; then
            echo "Running lint in client/"
            cd client
            npm ci
            npm run lint
          else
            echo "No client folder — skipping client lint"
          fi

      - name: Install and lint server
        run: |
          if [ -d server ]; then
            echo "Running lint in server/"
            cd server
            npm ci
            npm run lint
          else
            echo "No server folder — skipping server lint"
          fi
